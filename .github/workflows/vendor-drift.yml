# Drift sentinel. Once a week, checks whether any open-source vendor
# changed the files its hook contract is defined in since the commit Pulse's
# receiver was checked against (docs/vendor-formats.json keeps only the
# hooks). Red means "read those commits" — a hook contract may have moved. Read-only: it clones
# public repositories without file contents and prints; it writes nothing.
name: Vendor drift

on:
  schedule:
    - cron: "17 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  drift:
    name: Vendor hook drift
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - run: python3 scripts/vendor_drift.py
