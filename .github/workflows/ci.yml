name: CI

on:
  push:
    branches: ["main", "claude/**"]
  pull_request:
  workflow_dispatch:

# A push to a PR branch starts this workflow twice (push + pull_request) and
# every later push used to queue behind the previous one on the scarce macOS
# runners. One run per branch, newest wins.
concurrency:
  group: ci-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  gates:
    name: Gates (version · coverage · python)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      # The one gate list. release.yml, scripts/release.sh and package.sh
      # call the same script, so the lists can no longer drift apart.
      - name: Source gates
        run: bash scripts/gates.sh

  build:
    name: Build & test (macOS)
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - name: Show toolchain
        run: swift --version
      - name: Cache SwiftPM build
        uses: actions/cache@v4
        with:
          path: PulseBar/.build
          key: spm-${{ runner.os }}-${{ hashFiles('PulseBar/Package.swift') }}-${{ github.sha }}
          restore-keys: |
            spm-${{ runner.os }}-${{ hashFiles('PulseBar/Package.swift') }}-
      - name: Build
        run: swift build -c debug
        working-directory: PulseBar
      - name: Test
        run: swift test
        working-directory: PulseBar

      # Package on every push, not just at release. The launch crash in
      # 0.21–0.23.0 lived entirely in the packaging step: source was fine, tests
      # were green, and three DMGs shipped that died on open. package.sh runs
      # scripts/package_check.py against the assembled .app.
      - name: Package and verify the app bundle
        run: ./PulseBar/Scripts/package.sh

      # The native end-to-end wall: real vendor-shaped files at real paths
      # through the real scanner, asserting hero VALUES. This ran only as a
      # side effect of the resource gate before 0.98, which is part of why
      # four consecutive releases shipped a wrong tray hero with CI green.
      - name: Native fixture wall
        run: ./zig-out/package/Pulse.app/Contents/MacOS/PulseBar --native-fixture-test

      - name: Resource budget (native fixture)
        run: python3 scripts/resource_budget_check.py

      - name: Observation Truth captures
        id: observation_truth
        run: ./scripts/qa_observation_truth.sh

      - name: Observation Truth captures (en · dark)
        id: observation_truth_en_dark
        run: |
          PULSE_QA_APPEARANCE=dark \
          PULSE_QA_LANGUAGE=en \
          PULSE_QA_OUT="$PWD/zig-out/qa-observation-truth-en-dark" \
            ./scripts/qa_observation_truth.sh

      - name: Upload observation-truth PNGs
        uses: actions/upload-artifact@v4
        if: ${{ always() && steps.observation_truth.outcome == 'success' }}
        with:
          name: qa-observation-truth
          path: zig-out/qa-observation-truth/
          if-no-files-found: error

      - name: Upload observation-truth PNGs (en · dark)
        uses: actions/upload-artifact@v4
        if: ${{ always() && steps.observation_truth_en_dark.outcome == 'success' }}
        with:
          name: qa-observation-truth-en-dark
          path: zig-out/qa-observation-truth-en-dark/
          if-no-files-found: error
