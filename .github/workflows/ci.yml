name: CI

on:
  push:
    branches: ["main", "claude/**"]
  pull_request:
  workflow_dispatch:

# A push to a PR branch starts this workflow twice (push + pull_request) and
# every later push used to queue behind the previous one on the scarce macOS
# runners. One run per branch, newest wins.
concurrency:
  group: ci-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  gates:
    name: Source gates (version · catalog · icons · surfaces)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      # The one gate list. release.yml, scripts/release.sh and package.sh
      # call the same script, so the lists can no longer drift apart.
      - name: Source gates
        run: bash scripts/gates.sh
      # The Pi extension and the OpenCode plugin under Node (the runner's
      # own), against a stub of each vendor's API and a stub launcher:
      # recorded event sequences in, the exact ordered pulse-hook calls out.
      # Rendered from the Swift templates by scripts/render_adapters.py; the
      # macOS job runs the same test on the compiled code's render.
      - name: Hook modules under Node
        run: node scripts/js_adapters_test.mjs

  build:
    name: Build & test (macOS)
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v7
      - name: Show toolchain
        run: swift --version
      - name: Cache SwiftPM build
        uses: actions/cache@v6
        with:
          path: PulseBar/.build
          key: spm-${{ runner.os }}-${{ hashFiles('PulseBar/Package.swift') }}-${{ github.sha }}
          restore-keys: |
            spm-${{ runner.os }}-${{ hashFiles('PulseBar/Package.swift') }}-
      # Every target: the app (`PulseBar`) and the QA driver (`PulseQA`),
      # which the capture steps below run.
      - name: Build
        run: swift build -c debug
        working-directory: PulseBar
      - name: Test
        run: swift test
        working-directory: PulseBar

      # The compiled code renders the two modules (`PulseQA
      # --write-adapters`): they must equal the Linux job's render, and
      # pass the same Node test.
      - name: Hook modules under Node (compiled render)
        run: |
          set -euo pipefail
          QA="$(swift build --package-path PulseBar --show-bin-path)/PulseQA"
          OUT="$RUNNER_TEMP/adapters"
          "$QA" --write-adapters="$OUT/swift"
          python3 scripts/render_adapters.py "$OUT/python"
          diff -u "$OUT/python/pi.js" "$OUT/swift/pi.js"
          diff -u "$OUT/python/opencode.js" "$OUT/swift/opencode.js"
          if command -v node >/dev/null 2>&1; then
            node scripts/js_adapters_test.mjs "$OUT/swift"
          else
            echo "::warning::no node on this runner; the Linux job ran the module test"
          fi

      # The same hash-pinned dmgbuild release.yml uses, so every push builds
      # the laid-out DMG. Cosmetic: without it package.sh builds the plain one.
      - name: DMG layout tool (packaging only, never shipped)
        run: |
          set -euo pipefail
          VENV="$RUNNER_TEMP/dmgenv"
          if python3 -m venv "$VENV" \
             && "$VENV/bin/pip" install --quiet --disable-pip-version-check \
                  --require-hashes --only-binary :all: -r PulseBar/Packaging/DMG/requirements.txt; then
            echo "PULSE_DMGBUILD=$VENV/bin/dmgbuild" >> "$GITHUB_ENV"
          else
            echo "::warning::dmgbuild could not be installed; the DMG will have no window layout"
          fi

      # Package on every push, not just at release. A launch crash can live
      # entirely in the packaging step, with source fine and tests green.
      # package.sh runs scripts/package_check.py against the assembled .app.
      - name: Package and verify the app bundle
        run: ./PulseBar/Scripts/package.sh

      # The real path, which nothing else runs: the real installer writes
      # every hook into a throwaway home, recorded payloads go through the
      # installed launcher into the packaged app, and the replayed tray is
      # checked — red with one banner, answered, ended (scripts/e2e.sh).
      - name: End to end (installed hooks → packaged app → tray)
        timeout-minutes: 10
        run: ./scripts/e2e.sh

      # The QA driver, not the app: fixtures and captures live in `PulseQA`
      # and never ship (package_check.py fails an app binary that has them).
      # Every surface fixture in zh/en × light/dark, and the tray panel and
      # lamp for each status fixture. A missing PNG fails the build; the
      # manifests are printed to the log. The PNGs go to this run's
      # artifacts only — never into the repo or a release.
      - name: QA captures
        id: captures
        run: ./scripts/qa_captures.sh

      # The real tray popover's accessibility tree: every row a button, its
      # "›" a separate one, the window key. New; it reports without failing
      # the job until it has been green on the runner (then drop the flag).
      # Exit 2 is inconclusive (SwiftUI built no elements in process); any
      # non-zero exit leaves a warning annotation on the run.
      - name: Tray accessibility
        continue-on-error: true
        run: |
          status=0
          ./scripts/qa_captures.sh tray-a11y || status=$?
          case $status in
            0) ;;
            2) echo "::warning title=Tray accessibility::inconclusive — SwiftUI exposed no accessibility elements in process (see the step log)" ;;
            *) echo "::warning title=Tray accessibility::failed with exit $status (see the assert-tray lines in the step log)" ;;
          esac
          exit $status

      - name: Upload QA captures
        uses: actions/upload-artifact@v7
        if: ${{ always() && steps.captures.outcome != 'skipped' }}
        with:
          name: qa-captures
          path: zig-out/qa-captures/
          if-no-files-found: error
