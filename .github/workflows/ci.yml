name: CI

on:
  push:
    branches: ["main", "claude/**"]
  pull_request:
  workflow_dispatch:

jobs:
  gates:
    name: Gates (version · coverage · python)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Version consistency
        run: python3 scripts/version_check.py
      - name: Harvest coverage
        run: python3 scripts/coverage_check.py
      - name: Support matrix matches code
        run: python3 scripts/matrix_check.py
      - name: Every agent has a mark
        run: python3 scripts/make_agent_icons.py --check
      - name: No appearance frozen into a constant
        run: python3 scripts/appearance_check.py
      - name: Python compiles
        run: python3 -m py_compile src/*.py scripts/*.py

      # The legacy Python collector was deleted in 0.99. Nothing in the product
      # may fork an interpreter to observe a session again.
      - name: No Python in the harvest path
        run: |
          if grep -rn "activity_scan" --include='*.swift' PulseBar/Sources; then
            echo "::error::the harvest path must not reference the deleted Python collector"
            exit 1
          fi
          echo "OK — harvest is native only"
      # SwiftPM's generated Bundle.module accessor for an executable target
      # checks only the .app root and the baked build path, then calls
      # fatalError(). Using it turns a packaging mistake into a launch crash —
      # which is what shipped in 0.21.0, 0.22.0 and 0.23.0. PulseResources
      # resolves the same bundle and returns nil instead.
      - name: No Bundle.module in app code
        run: |
          # `^[^/]*` keeps the doc comments in PulseResources.swift from
          # matching the rule they exist to explain.
          if grep -rnE --include='*.swift' '^[^/]*[^.a-zA-Z]Bundle\.module' PulseBar/Sources; then
            echo "::error::use PulseResources instead of Bundle.module — it fatalErrors when the bundle moves"
            exit 1
          fi
          echo "OK — no Bundle.module references"
      - name: Bundled hook assets are in sync with src/
        run: |
          for py in pulse_hook.py install_hooks.py; do
            diff -u "src/$py" "PulseBar/Sources/PulseBar/Resources/$py" \
              || { echo "::error::PulseBar/Sources/PulseBar/Resources/$py is stale — re-run package.sh"; exit 1; }
          done

  build:
    name: Build & test (macOS)
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - name: Show toolchain
        run: swift --version
      - name: Build
        run: swift build -c debug
        working-directory: PulseBar
      - name: Test
        run: swift test
        working-directory: PulseBar

      # Package on every push, not just at release. The launch crash in
      # 0.21–0.23.0 lived entirely in the packaging step: source was fine, tests
      # were green, and three DMGs shipped that died on open. package.sh runs
      # scripts/package_check.py against the assembled .app.
      - name: Package and verify the app bundle
        run: ./PulseBar/Scripts/package.sh

      # The native end-to-end wall: real vendor-shaped files at real paths
      # through the real scanner, asserting hero VALUES. This ran only as a
      # side effect of the resource gate before 0.98, which is part of why
      # four consecutive releases shipped a wrong tray hero with CI green.
      - name: Native fixture wall
        run: ./zig-out/package/Pulse.app/Contents/MacOS/PulseBar --native-fixture-test

      - name: Resource budget (native fixture)
        run: python3 scripts/resource_budget_check.py

      - name: Observation Truth captures
        id: observation_truth
        run: ./scripts/qa_observation_truth.sh

      - name: Observation Truth captures (en · dark)
        id: observation_truth_en_dark
        run: |
          PULSE_QA_APPEARANCE=dark \
          PULSE_QA_LANGUAGE=en \
          PULSE_QA_OUT="$PWD/zig-out/qa-observation-truth-en-dark" \
            ./scripts/qa_observation_truth.sh

      - name: Upload observation-truth PNGs
        uses: actions/upload-artifact@v4
        if: ${{ always() && steps.observation_truth.outcome == 'success' }}
        with:
          name: qa-observation-truth
          path: zig-out/qa-observation-truth/
          if-no-files-found: error

      - name: Upload observation-truth PNGs (en · dark)
        uses: actions/upload-artifact@v4
        if: ${{ always() && steps.observation_truth_en_dark.outcome == 'success' }}
        with:
          name: qa-observation-truth-en-dark
          path: zig-out/qa-observation-truth-en-dark/
          if-no-files-found: error
