name: Release

# Three ways in, all ending at the same job:
#
#   1. push a `v*.*.*` tag                     — the classic path
#   2. workflow_dispatch                       — from the Actions tab
#   3. push to main with [release] in the message
#
# (3) exists because tag pushes need tag-write credentials that a CI/agent
# session may not have. The marker keeps it explicit — no push ever releases by
# accident — and the job additionally refuses to publish a version that already
# has a Release, so re-running is harmless.
#
# The marker path is limited to `main`. It was `**` while this workflow lived
# only on a feature branch, which was the sole way to publish at all; now that
# it is on the default branch, a release can no longer be cut from a branch
# nobody has reviewed. Tag pushes still work from anywhere.
on:
  push:
    tags: ["v*.*.*"]
    branches: ["main"]
  workflow_dispatch:
    inputs:
      version:
        description: "Version to release (e.g. 0.22.0). Defaults to PulseVersion.semver."
        required: false

permissions:
  contents: write

jobs:
  decide:
    name: Decide whether to release
    # Filter before spending a runner: ordinary pushes do not reach this job.
    if: >-
      github.event_name != 'push'
      || startsWith(github.ref, 'refs/tags/')
      || contains(github.event.head_commit.message, '[release]')
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.check.outputs.version }}
      release: ${{ steps.check.outputs.release }}
    steps:
      - uses: actions/checkout@v4

      - name: Resolve version and preconditions
        id: check
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          CODE="$(sed -n 's/.*static let semver = "\([^"]*\)".*/\1/p' PulseBar/Sources/PulseBar/Models.swift)"

          case "${{ github.event_name }}" in
            push)
              if [[ "${GITHUB_REF}" == refs/tags/* ]]; then
                VERSION="${GITHUB_REF_NAME#v}"
                REASON="tag"
              else
                VERSION="$CODE"
                REASON="marker"
              fi
              ;;
            workflow_dispatch)
              VERSION="${{ github.event.inputs.version }}"
              VERSION="${VERSION:-$CODE}"
              REASON="dispatch"
              ;;
          esac
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

          # The tag must describe the code it points at.
          if [[ "$CODE" != "$VERSION" ]]; then
            echo "::error::asked to release $VERSION but Models.swift says $CODE"
            exit 1
          fi

          # Release notes are not optional.
          python3 scripts/changelog_section.py "$VERSION" > /dev/null

          # Publishing twice would silently overwrite an artefact people already have.
          if gh release view "v$VERSION" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "v$VERSION is already released — nothing to do"
            echo "release=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "releasing $VERSION (trigger: $REASON)"
          echo "release=true" >> "$GITHUB_OUTPUT"

  release:
    name: Build, package, publish
    needs: decide
    if: needs.decide.outputs.release == 'true'
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Gates
        run: |
          python3 scripts/version_check.py
          python3 scripts/coverage_check.py
          python3 scripts/matrix_check.py
          python3 scripts/make_agent_icons.py --check
          python3 scripts/appearance_check.py
          python3 scripts/harvest_stats_check.py

      - name: Test
        run: swift test
        working-directory: PulseBar

      - name: Prepare Developer ID and notarization credentials
        id: signing
        env:
          PULSE_CERTIFICATE_P12: ${{ secrets.PULSE_CERTIFICATE_P12 }}
          PULSE_CERTIFICATE_PASSWORD: ${{ secrets.PULSE_CERTIFICATE_PASSWORD }}
          PULSE_SIGN_IDENTITY: ${{ secrets.PULSE_SIGN_IDENTITY }}
          PULSE_NOTARY_KEY_P8: ${{ secrets.PULSE_NOTARY_KEY_P8 }}
          PULSE_NOTARY_KEY_ID: ${{ secrets.PULSE_NOTARY_KEY_ID }}
          PULSE_NOTARY_ISSUER_ID: ${{ secrets.PULSE_NOTARY_ISSUER_ID }}
        run: |
          set -euo pipefail
          # A public release is still useful before the project has an Apple
          # Developer account. Fall back to the package script's explicit
          # ad-hoc signature and leave notarization disabled; the release page
          # and package output already state that Gatekeeper will block it on
          # other Macs. Once all six secrets exist, keep the signed/notarized
          # path unchanged.
          missing=""
          for name in PULSE_CERTIFICATE_P12 PULSE_CERTIFICATE_PASSWORD PULSE_SIGN_IDENTITY \
                      PULSE_NOTARY_KEY_P8 PULSE_NOTARY_KEY_ID PULSE_NOTARY_ISSUER_ID; do
            if [[ -z "${!name:-}" ]]; then
              missing+=" $name"
            fi
          done

          if [[ -n "$missing" ]]; then
            echo "::warning::Apple signing/notarization secrets are unavailable:$missing — publishing an ad-hoc, unnotarized DMG"
            echo "sign_identity=-" >> "$GITHUB_OUTPUT"
            echo "notary_profile=" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          KEYCHAIN="$RUNNER_TEMP/pulse-signing.keychain-db"
          KEYCHAIN_PASSWORD="$(openssl rand -hex 24)"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security list-keychains -d user -s "$KEYCHAIN" login.keychain-db

          CERT="$RUNNER_TEMP/pulse-developer-id.p12"
          printf '%s' "$PULSE_CERTIFICATE_P12" | base64 -D > "$CERT"
          security import "$CERT" -k "$KEYCHAIN" -P "$PULSE_CERTIFICATE_PASSWORD" \
            -T /usr/bin/codesign -T /usr/bin/security
          security set-key-partition-list -S apple-tool:,apple: -s \
            -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security find-identity -v -p codesigning "$KEYCHAIN" | grep -F "$PULSE_SIGN_IDENTITY"

          NOTARY_KEY="$RUNNER_TEMP/AuthKey_${PULSE_NOTARY_KEY_ID}.p8"
          printf '%s' "$PULSE_NOTARY_KEY_P8" | base64 -D > "$NOTARY_KEY"
          xcrun notarytool store-credentials pulse-release \
            --key "$NOTARY_KEY" \
            --key-id "$PULSE_NOTARY_KEY_ID" \
            --issuer "$PULSE_NOTARY_ISSUER_ID"
          echo "sign_identity=$PULSE_SIGN_IDENTITY" >> "$GITHUB_OUTPUT"
          echo "notary_profile=pulse-release" >> "$GITHUB_OUTPUT"

      - name: Package
        env:
          PULSE_SIGN_IDENTITY: ${{ steps.signing.outputs.sign_identity }}
          PULSE_NOTARY_PROFILE: ${{ steps.signing.outputs.notary_profile }}
        run: ./PulseBar/Scripts/package.sh

      - name: Release notes from CHANGELOG
        run: |
          VERSION="${{ needs.decide.outputs.version }}"
          DMG="zig-out/package/pulse-${VERSION}-macos-PulseBar.dmg"
          python3 scripts/changelog_section.py "$VERSION" > /tmp/notes.md
          {
            echo
            echo "### Download verification"
            echo
            echo '```text'
            shasum -a 256 "$DMG"
            echo '```'
          } >> /tmp/notes.md

      - name: Publish
        uses: softprops/action-gh-release@v2
        with:
          # Creates the tag at this commit when it does not exist yet, using the
          # workflow's own contents:write token.
          tag_name: v${{ needs.decide.outputs.version }}
          target_commitish: ${{ github.sha }}
          name: Pulse ${{ needs.decide.outputs.version }}
          body_path: /tmp/notes.md
          files: zig-out/package/pulse-${{ needs.decide.outputs.version }}-macos-PulseBar.dmg
          fail_on_unmatched_files: true
