name: Release

# Three ways in, all ending at the same job:
#
#   1. push a `v*.*.*` tag                     — the classic path
#   2. workflow_dispatch                       — from the Actions tab
#   3. push to main with [release] in the message
#
# (3) exists because tag pushes need tag-write credentials that a CI/agent
# session may not have. The marker keeps it explicit — no push ever releases by
# accident — and the job additionally refuses to publish a version that already
# has a Release, so re-running is harmless.
#
# The marker path is limited to `main`. It was `**` while this workflow lived
# only on a feature branch, which was the sole way to publish at all; now that
# it is on the default branch, a release can no longer be cut from a branch
# nobody has reviewed. Tag pushes still work from anywhere.
on:
  push:
    tags: ["v*.*.*"]
    branches: ["main"]
  workflow_dispatch:
    inputs:
      version:
        description: "Version to release (e.g. 0.22.0). Defaults to PulseVersion.semver."
        required: false

permissions:
  contents: write

jobs:
  decide:
    name: Decide whether to release
    # Filter before spending a runner: ordinary pushes do not reach this job.
    if: >-
      github.event_name != 'push'
      || startsWith(github.ref, 'refs/tags/')
      || contains(github.event.head_commit.message, '[release]')
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.check.outputs.version }}
      release: ${{ steps.check.outputs.release }}
    steps:
      - uses: actions/checkout@v4

      - name: Resolve version and preconditions
        id: check
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          CODE="$(sed -n 's/.*static let semver = "\([^"]*\)".*/\1/p' PulseBar/Sources/PulseBar/Models.swift)"

          case "${{ github.event_name }}" in
            push)
              if [[ "${GITHUB_REF}" == refs/tags/* ]]; then
                VERSION="${GITHUB_REF_NAME#v}"
                REASON="tag"
              else
                VERSION="$CODE"
                REASON="marker"
              fi
              ;;
            workflow_dispatch)
              VERSION="${{ github.event.inputs.version }}"
              VERSION="${VERSION:-$CODE}"
              REASON="dispatch"
              ;;
          esac
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

          # The tag must describe the code it points at.
          if [[ "$CODE" != "$VERSION" ]]; then
            echo "::error::asked to release $VERSION but Models.swift says $CODE"
            exit 1
          fi

          # Release notes are not optional.
          python3 scripts/changelog_section.py "$VERSION" > /dev/null

          # Publishing twice would silently overwrite an artefact people already have.
          if gh release view "v$VERSION" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "v$VERSION is already released — nothing to do"
            echo "release=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "releasing $VERSION (trigger: $REASON)"
          echo "release=true" >> "$GITHUB_OUTPUT"

  release:
    name: Build, package, publish
    needs: decide
    if: needs.decide.outputs.release == 'true'
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Gates
        run: |
          python3 scripts/version_check.py
          python3 scripts/coverage_check.py
          python3 scripts/matrix_check.py
          python3 scripts/make_agent_icons.py --check
          python3 scripts/appearance_check.py
          python3 scripts/harvest_stats_check.py

      - name: Test
        run: swift test
        working-directory: PulseBar

      - name: Package
        env:
          # Optional: set these repo secrets to ship a Gatekeeper-friendly build.
          PULSE_SIGN_IDENTITY: ${{ secrets.PULSE_SIGN_IDENTITY }}
          PULSE_NOTARY_PROFILE: ${{ secrets.PULSE_NOTARY_PROFILE }}
        run: ./PulseBar/Scripts/package.sh

      - name: Release notes from CHANGELOG
        run: |
          python3 scripts/changelog_section.py "${{ needs.decide.outputs.version }}" > /tmp/notes.md
          if [[ -z "${{ secrets.PULSE_SIGN_IDENTITY }}" ]]; then
            {
              echo
              echo "---"
              echo "**This build is ad-hoc signed.** macOS will refuse it on first open —"
              echo "right-click the app and choose Open, or run:"
              echo
              echo '```'
              echo 'xattr -dr com.apple.quarantine /Applications/Pulse.app'
              echo '```'
            } >> /tmp/notes.md
          fi

      - name: Publish
        uses: softprops/action-gh-release@v2
        with:
          # Creates the tag at this commit when it does not exist yet, using the
          # workflow's own contents:write token.
          tag_name: v${{ needs.decide.outputs.version }}
          target_commitish: ${{ github.sha }}
          name: Pulse ${{ needs.decide.outputs.version }}
          body_path: /tmp/notes.md
          files: zig-out/package/pulse-${{ needs.decide.outputs.version }}-macos-PulseBar.dmg
          fail_on_unmatched_files: true
