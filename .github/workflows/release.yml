name: Release

# Three ways in, all ending at the same job:
#
#   1. push a `v*.*.*` tag                     — the classic path
#   2. workflow_dispatch                       — from the Actions tab
#   3. push to main with [release] in the message
#
# (3) exists because tag pushes need tag-write credentials that a CI/agent
# session may not have. `[release] [prerelease]` (scripts/release.sh
# --prerelease) publishes the same DMG and notes as a GitHub *prerelease*,
# never marked Latest: GitHub's Latest does not show it until the owner
# promotes it on GitHub after a
# real-Mac smoke run (untick "pre-release", set as latest), or a push to main
# with [promote] in the message promotes the current version's prerelease
# (the `promote` job below) without rebuilding anything. The marker keeps it explicit — no push ever releases by
# accident — and the job additionally refuses to publish a version that already
# has a Release, so re-running is harmless.
#
# The marker path is limited to `main`. It was `**` while this workflow lived
# only on a feature branch, which was the sole way to publish at all; now that
# it is on the default branch, a release can no longer be cut from a branch
# nobody has reviewed. Tag pushes still work from anywhere.
on:
  push:
    tags: ["v*.*.*"]
    branches: ["main"]
  workflow_dispatch:
    inputs:
      version:
        description: "Version to release (e.g. 0.22.0). Defaults to PulseVersion.semver."
        required: false
      prerelease:
        description: "Publish as a GitHub prerelease (not Latest)"
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  decide:
    name: Decide whether to release
    # Filter before spending a runner: ordinary pushes do not reach this job.
    if: >-
      github.event_name != 'push'
      || startsWith(github.ref, 'refs/tags/')
      || (contains(github.event.head_commit.message, '[release]')
          && !contains(github.event.head_commit.message, '[promote]'))
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.check.outputs.version }}
      release: ${{ steps.check.outputs.release }}
      prerelease: ${{ steps.check.outputs.prerelease }}
    steps:
      - uses: actions/checkout@v7

      - name: Resolve version and preconditions
        id: check
        env:
          GH_TOKEN: ${{ github.token }}
          # Through env, never interpolated into the script: a commit message
          # is arbitrary text.
          COMMIT_MESSAGE: ${{ github.event.head_commit.message }}
          DISPATCH_PRERELEASE: ${{ github.event.inputs.prerelease }}
        run: |
          set -euo pipefail
          CODE="$(sed -n 's/.*static let semver = "\([^"]*\)".*/\1/p' PulseBar/Sources/PulseApp/Models.swift)"

          case "${{ github.event_name }}" in
            push)
              if [[ "${GITHUB_REF}" == refs/tags/* ]]; then
                VERSION="${GITHUB_REF_NAME#v}"
                REASON="tag"
              else
                VERSION="$CODE"
                REASON="marker"
              fi
              ;;
            workflow_dispatch)
              VERSION="${{ github.event.inputs.version }}"
              VERSION="${VERSION:-$CODE}"
              REASON="dispatch"
              ;;
          esac
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

          PRERELEASE=false
          if [[ "${{ github.event_name }}" == "push" && "$COMMIT_MESSAGE" == *"[prerelease]"* ]]; then
            PRERELEASE=true
          elif [[ "${DISPATCH_PRERELEASE:-false}" == "true" ]]; then
            PRERELEASE=true
          fi
          echo "prerelease=$PRERELEASE" >> "$GITHUB_OUTPUT"

          # The tag must describe the code it points at.
          if [[ "$CODE" != "$VERSION" ]]; then
            echo "::error::asked to release $VERSION but Models.swift says $CODE"
            exit 1
          fi

          # Release notes are not optional.
          python3 scripts/changelog_section.py "$VERSION" > /dev/null

          # Publishing twice would silently overwrite an artefact people already have.
          if gh release view "v$VERSION" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "v$VERSION is already released — nothing to do"
            echo "release=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "releasing $VERSION (trigger: $REASON, prerelease: $PRERELEASE)"
          echo "release=true" >> "$GITHUB_OUTPUT"

  release:
    name: Build, package, publish
    needs: decide
    if: needs.decide.outputs.release == 'true'
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Gates
        run: bash scripts/gates.sh

      - name: Test
        run: swift test
        working-directory: PulseBar

      - name: Prepare Developer ID and notarization credentials
        id: signing
        env:
          PULSE_CERTIFICATE_P12: ${{ secrets.PULSE_CERTIFICATE_P12 }}
          PULSE_CERTIFICATE_PASSWORD: ${{ secrets.PULSE_CERTIFICATE_PASSWORD }}
          PULSE_SIGN_IDENTITY: ${{ secrets.PULSE_SIGN_IDENTITY }}
          PULSE_NOTARY_KEY_P8: ${{ secrets.PULSE_NOTARY_KEY_P8 }}
          PULSE_NOTARY_KEY_ID: ${{ secrets.PULSE_NOTARY_KEY_ID }}
          PULSE_NOTARY_ISSUER_ID: ${{ secrets.PULSE_NOTARY_ISSUER_ID }}
        run: |
          set -euo pipefail
          # A public release is still useful before the project has an Apple
          # Developer account. Fall back to the package script's explicit
          # ad-hoc signature and leave notarization disabled; the release page
          # and package output already state that Gatekeeper will block it on
          # other Macs. Once all six secrets exist, keep the signed/notarized
          # path unchanged.
          missing=""
          for name in PULSE_CERTIFICATE_P12 PULSE_CERTIFICATE_PASSWORD PULSE_SIGN_IDENTITY \
                      PULSE_NOTARY_KEY_P8 PULSE_NOTARY_KEY_ID PULSE_NOTARY_ISSUER_ID; do
            if [[ -z "${!name:-}" ]]; then
              missing+=" $name"
            fi
          done

          if [[ -n "$missing" ]]; then
            echo "::warning::Apple signing/notarization secrets are unavailable:$missing — publishing an ad-hoc, unnotarized DMG"
            echo "sign_identity=-" >> "$GITHUB_OUTPUT"
            echo "notary_profile=" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          KEYCHAIN="$RUNNER_TEMP/pulse-signing.keychain-db"
          KEYCHAIN_PASSWORD="$(openssl rand -hex 24)"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security list-keychains -d user -s "$KEYCHAIN" login.keychain-db

          CERT="$RUNNER_TEMP/pulse-developer-id.p12"
          printf '%s' "$PULSE_CERTIFICATE_P12" | base64 -D > "$CERT"
          security import "$CERT" -k "$KEYCHAIN" -P "$PULSE_CERTIFICATE_PASSWORD" \
            -T /usr/bin/codesign -T /usr/bin/security
          security set-key-partition-list -S apple-tool:,apple: -s \
            -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security find-identity -v -p codesigning "$KEYCHAIN" | grep -F "$PULSE_SIGN_IDENTITY"

          NOTARY_KEY="$RUNNER_TEMP/AuthKey_${PULSE_NOTARY_KEY_ID}.p8"
          printf '%s' "$PULSE_NOTARY_KEY_P8" | base64 -D > "$NOTARY_KEY"
          xcrun notarytool store-credentials pulse-release \
            --key "$NOTARY_KEY" \
            --key-id "$PULSE_NOTARY_KEY_ID" \
            --issuer "$PULSE_NOTARY_ISSUER_ID"
          echo "sign_identity=$PULSE_SIGN_IDENTITY" >> "$GITHUB_OUTPUT"
          echo "notary_profile=pulse-release" >> "$GITHUB_OUTPUT"

      - name: Package
        env:
          PULSE_SIGN_IDENTITY: ${{ steps.signing.outputs.sign_identity }}
          PULSE_NOTARY_PROFILE: ${{ steps.signing.outputs.notary_profile }}
        run: ./PulseBar/Scripts/package.sh

      - name: Release notes and checksum
        run: |
          set -euo pipefail
          VERSION="${{ needs.decide.outputs.version }}"
          DMG_NAME="pulse-${VERSION}-macos-PulseBar.dmg"
          # The checksum file names the DMG relative to itself, so
          # `shasum -a 256 -c pulse-….dmg.sha256` works in the download folder.
          (cd zig-out/package && shasum -a 256 "$DMG_NAME" > "$DMG_NAME.sha256")
          python3 scripts/changelog_section.py "$VERSION" > /tmp/notes.md
          if [[ "${{ needs.decide.outputs.prerelease }}" == "true" ]]; then
            {
              echo
              echo "### Prerelease"
              echo
              echo "Not yet verified on a real Mac. GitHub **Latest** does not offer this"
              echo "version until it is promoted."
            } >> /tmp/notes.md
          fi
          if [[ "${{ steps.signing.outputs.sign_identity }}" == "-" || -z "${{ steps.signing.outputs.notary_profile }}" ]]; then
            {
              echo
              echo "### Gatekeeper"
              echo
              echo "This build is **ad-hoc / unnotarized** (no Apple Developer ID in CI)."
              echo "About stays \`preview\` — it is **not** Gatekeeper-ready and must not be"
              echo "described as notarized stable. First open: drag Pulse to Applications and"
              echo "open it once; when macOS blocks it, go to **System Settings → Privacy &"
              echo "Security**, scroll to Security and click **Open Anyway**. Or, in Terminal:"
              echo "\`xattr -dr com.apple.quarantine /Applications/Pulse.app\`."
              echo "(macOS 15 removed the Control-click → Open shortcut.)"
            } >> /tmp/notes.md
          fi
          {
            echo
            echo "### Download verification"
            echo
            echo '```text'
            cat "zig-out/package/$DMG_NAME.sha256"
            echo '```'
          } >> /tmp/notes.md

      - name: Publish
        uses: softprops/action-gh-release@v3
        with:
          # Creates the tag at this commit when it does not exist yet, using the
          # workflow's own contents:write token.
          tag_name: v${{ needs.decide.outputs.version }}
          target_commitish: ${{ github.sha }}
          name: Pulse ${{ needs.decide.outputs.version }}
          # Without an Apple Developer ID the DMG is still ad-hoc / unnotarized
          # (Info.plist stays preview — never stamp stable). A release marked
          # [prerelease] is published as a GitHub prerelease and never as
          # Latest; every other release becomes Latest so /releases/latest
          # tracks the current semver.
          prerelease: ${{ needs.decide.outputs.prerelease == 'true' }}
          make_latest: ${{ needs.decide.outputs.prerelease == 'true' && 'false' || 'true' }}
          body_path: /tmp/notes.md
          files: |
            zig-out/package/pulse-${{ needs.decide.outputs.version }}-macos-PulseBar.dmg
            zig-out/package/pulse-${{ needs.decide.outputs.version }}-macos-PulseBar.dmg.sha256
          fail_on_unmatched_files: true

  promote:
    name: Promote the prerelease to Latest
    # A push to main carrying [promote]: the version in Models.swift, already
    # published as a prerelease, becomes an ordinary release and Latest. Same
    # tag, same DMG — only the flags and the prerelease note change.
    if: >-
      github.event_name == 'push'
      && github.ref == 'refs/heads/main'
      && contains(github.event.head_commit.message, '[promote]')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Promote
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          VERSION="$(sed -n 's/.*static let semver = "\([^"]*\)".*/\1/p' PulseBar/Sources/PulseApp/Models.swift)"
          if [[ "$(gh release view "v$VERSION" --repo "$GITHUB_REPOSITORY" --json isPrerelease -q .isPrerelease)" != "true" ]]; then
            echo "v$VERSION is not a prerelease — nothing to promote"
            exit 0
          fi
          gh release view "v$VERSION" --repo "$GITHUB_REPOSITORY" --json body -q .body > /tmp/old.md
          python3 scripts/changelog_section.py "$VERSION" > /tmp/section.md
          # The notes are this version's CHANGELOG section as it reads now,
          # followed by the release's own blocks (Gatekeeper, checksum) —
          # without the prerelease note.
          python3 - <<'PY'
          import re
          old = open("/tmp/old.md").read()
          tail = old[m.start():] if (m := re.search(r"\n### (Gatekeeper|Download verification)\n", old)) else ""
          open("/tmp/body.md", "w").write(open("/tmp/section.md").read().rstrip("\n") + "\n" + tail)
          PY
          gh release edit "v$VERSION" --repo "$GITHUB_REPOSITORY" \
            --prerelease=false --latest --notes-file /tmp/body.md
          echo "promoted v$VERSION to Latest"
